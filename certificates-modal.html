<div class="cert-popup" id="certificatesPopup">
  <div class="cert-popup__overlay" data-cert-close></div>

  <div class="cert-popup__window">
    <button class="cert-popup__close" type="button" data-cert-close>&times;</button>

    <h2 class="cert-popup__title">Документы и сертификаты</h2>
    <p class="cert-popup__text">
      Документы, подтверждающие образование, квалификацию и профессиональную подготовку врача.
    </p>

    <div class="cert-slider cert-slider--modal" data-cert-slider>
      <button class="cert-slider__arrow cert-slider__arrow--prev" type="button" data-cert-prev>&#8249;</button>

      <div class="cert-slider__image-wrap">
        <img class="cert-slider__image" data-cert-image src="" alt="Документ врача">
      </div>

      <button class="cert-slider__arrow cert-slider__arrow--next" type="button" data-cert-next>&#8250;</button>

      <div class="cert-slider__bottom">
        <p class="cert-slider__caption" data-cert-caption></p>
        <div class="cert-slider__counter" data-cert-counter></div>
      </div>

      <div class="cert-slider__dots" data-cert-dots></div>
    </div>
  </div>
</div>
