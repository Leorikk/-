<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Вход в личный кабинет - Врач Деркач В.В.</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; background: #F4F8F8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { background: white; padding: 40px; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,0,0,0.06); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { font-size: 24px; font-weight: 800; color: #1a1a1a; margin-bottom: 8px; text-align: center; }
        p { font-size: 14px; color: #666; text-align: center; margin-bottom: 24px; }
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input { display: block; width: 100%; padding: 12px 16px; margin-bottom: 20px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; font-family: inherit; }
        input:focus { border-color: #16697A; outline: none; box-shadow: 0 0 0 3px rgba(22, 105, 122, 0.15); }
        .btn-submit { width: 100%; padding: 14px; background: #16697A; color: white; border: none; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #0E3440; }
        .back-link { display: block; text-align: center; margin-top: 16px; color: #16697A; text-decoration: none; font-size: 14px; font-weight: 500; }
        .back-link:hover { text-decoration: underline; }
        .pw-wrap { position: relative; }
        .pw-wrap input { padding-right: 96px; }
        .pw-toggle { position: absolute; right: 8px; top: 6px; height: 36px; padding: 0 12px; border: none; border-radius: 10px; background: #E6F1F2; color: #16697A; font: 600 13px 'Inter', sans-serif; cursor: pointer; }
        .auth-msg { margin: -8px 0 16px; padding: 10px 14px; border-radius: 12px; background: #FFF0F0; color: #b42318; font-size: 14px; text-align: left; }
        .auth-note { margin: 16px 0 0; font-size: 12px; color: #777; }
        .btn-submit:disabled { opacity: .6; cursor: default; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>Личный кабинет</h2>
        <p>Войдите для доступа к программе лояльности и записям</p>
        <form id="loginForm" action="api/auth/login" method="post" novalidate>
            <label for="login">Телефон или Email</label>
            <input id="login" name="login" type="text" placeholder="example@mail.ru" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            <label for="password">Пароль</label>
            <div class="pw-wrap">
                <input id="password" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" class="pw-toggle" id="pwToggle" aria-label="Показать пароль" aria-pressed="false">Показать</button>
            </div>
            <p class="auth-msg" id="authMsg" role="alert" aria-live="assertive" hidden></p>
            <button type="submit" class="btn-submit" id="loginBtn">Войти</button>
        </form>
        <p class="auth-note">Пароль передаётся только по защищённому соединению (HTTPS) и нигде не сохраняется в браузере.</p>
        <a href="index.html" class="back-link">← Вернуться на главную сайт</a>
    </div>
    <script>
    (function () {
        var form = document.getElementById('loginForm');
        var msg = document.getElementById('authMsg');
        var btn = document.getElementById('loginBtn');
        var pw = document.getElementById('password');
        var toggle = document.getElementById('pwToggle');

        // Адрес входа на сервере. Сервер должен проверять хэш пароля и выдавать сессию в cookie HttpOnly + Secure + SameSite
        var LOGIN_URL = '/api/auth/login';
        var NEXT_URL = 'profile.html';

        function show(text) { msg.textContent = text; msg.hidden = false; }
        function secure() {
            return location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        }

        toggle.addEventListener('click', function () {
            var open = pw.type === 'password';
            pw.type = open ? 'text' : 'password';
            toggle.textContent = open ? 'Скрыть' : 'Показать';
            toggle.setAttribute('aria-label', open ? 'Скрыть пароль' : 'Показать пароль');
            toggle.setAttribute('aria-pressed', open ? 'true' : 'false');
        });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            msg.hidden = true;
            var login = document.getElementById('login').value.trim();
            var password = pw.value;
            if (!login || !password) { show('Введите телефон или email и пароль.'); return; }
            if (!secure()) { show('Вход возможен только по защищённому соединению (HTTPS). Данные не отправлены.'); return; }

            btn.disabled = true;
            fetch(LOGIN_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                credentials: 'same-origin',
                cache: 'no-store',
                referrerPolicy: 'no-referrer',
                body: JSON.stringify({ login: login, password: password })
            }).then(function (res) {
                if (res.ok) { window.location.replace(NEXT_URL); return; }
                if (res.status === 401 || res.status === 403) show('Неверный логин или пароль.');
                else if (res.status === 429) show('Слишком много попыток входа. Попробуйте позже.');
                else show('Сервис входа временно недоступен. Попробуйте позже.');
            }).catch(function () {
                show('Не удалось связаться с сервером. Проверьте соединение.');
            }).then(function () {
                pw.value = ''; // пароль не остаётся в поле после отправки
                btn.disabled = false;
            });
        });
    })();
    </script>
  <script src="a11y.js" defer></script>
  <script src="chat.js" defer></script>
</body>
</html>
