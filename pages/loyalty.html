<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Программа лояльности - Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background: #F4F8F8; color: #1E2A2D; min-height: 100vh; }
        .sidebar { width: 280px; background: #1E2A2D; color: white; height: 100vh; padding: 30px 20px; box-sizing: border-box; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; }
        .sidebar h3 { font-size: 18px; font-weight: 800; margin-bottom: 24px; color: #16697A; padding-left: 10px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 6px; font-weight: 500; font-size: 15px; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: rgba(22, 105, 122, 0.2); }
        .sidebar a.active { color: #16697A; font-weight: 600; }
        .content { margin-left: 280px; flex: 1; padding: 40px; box-sizing: border-box; max-width: 1000px; }
        .card { background: white; padding: 32px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.03); margin-bottom: 24px; }
        h2 { font-size: 26px; font-weight: 800; margin-bottom: 20px; color: #1a1a1a; }
        .badge { background: #FFF3EB; color: #16697A; padding: 6px 14px; border-radius: 20px; font-weight: 700; display: inline-block; font-size: 15px; }
        ul { padding-left: 20px; color: #555; line-height: 1.6; }
        li { margin-bottom: 8px; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; padding: 20px; }
            body { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Личный кабинет</h3>
        <a href="pages/profile.html">Профиль</a>
        <a href="pages/loyalty.html" class="active">Программа лояльности</a>
        <a href="pages/services.html">Сервисная информация</a>
        <a href="pages/settings.html">Настройки</a>
        <a href="index.html">На главную</a>
        <a href="pages/auth.html" style="color: #ff6b6b; margin-top: auto;">Выход</a>
    </div>
    <div class="content">
        <div class="card">
            <h2>Программа лояльности</h2>
            <p>Ваш статус: <span class="badge">Золотой</span></p>
            <p>Накопленные баллы: <strong>1 250 баллов</strong></p>
        </div>
        <div class="card">
            <h2>Мои преимущества</h2>
            <ul>
                <li>Скидка 10% на базовые услуги</li>
                <li>Приоритетный доступ к сервисам</li>
            </ul>
        </div>
    </div>
  <script src="a11y.js" defer></script>
  <script src="chat.js" defer></script>
</body>
</html>
