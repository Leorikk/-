<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Настройки - Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background: #F4F8F8; color: #1E2A2D; min-height: 100vh; }
        .sidebar { width: 280px; background: #1E2A2D; color: white; height: 100vh; padding: 30px 20px; box-sizing: border-box; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; }
        .sidebar h3 { font-size: 18px; font-weight: 800; margin-bottom: 24px; color: #16697A; padding-left: 10px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 6px; font-weight: 500; font-size: 15px; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: rgba(22, 105, 122, 0.2); }
        .sidebar a.active { color: #16697A; font-weight: 600; }
        .content { margin-left: 280px; flex: 1; padding: 40px; box-sizing: border-box; max-width: 1000px; }
        .card { background: white; padding: 32px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.03); }
        h2 { font-size: 26px; font-weight: 800; margin-bottom: 20px; color: #1a1a1a; }
        label { display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px; }
        input { display: block; width: 100%; padding: 12px 16px; margin: 8px 0 20px 0; box-sizing: border-box; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; font-family: inherit; }
        input:focus { border-color: #16697A; outline: none; box-shadow: 0 0 0 3px rgba(22, 105, 122, 0.15); }
        button { padding: 14px 24px; background: #16697A; color: white; border: none; border-radius: 14px; cursor: pointer; font-weight: 700; font-size: 15px; transition: background 0.2s; }
        button:hover { background: #0E3440; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; padding: 20px; }
            body { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Личный кабинет</h3>
        <a href="pages/profile.html">Профиль</a>
        <a href="pages/loyalty.html">Программа лояльности</a>
        <a href="pages/services.html">Сервисная информация</a>
        <a href="pages/settings.html" class="active">Настройки</a>
        <a href="index.html">На главную</a>
        <a href="pages/auth.html" style="color: #ff6b6b; margin-top: auto;">Выход</a>
    </div>
    <div class="content">
        <div class="card">
            <h2>Настройки профиля и безопасности</h2>
            <label>Смена пароля:</label>
            <input type="password" placeholder="Текущий пароль">
            <input type="password" placeholder="Новый пароль">
            <button onclick="alert('Пароль успешно изменен')">Сохранить изменения</button>
        </div>
    </div>
  <script src="a11y.js" defer></script>
  <script src="chat.js" defer></script>
</body>
</html>
