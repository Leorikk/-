<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
  <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль - Личный кабинет</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; margin: 0; display: flex; background: #F4F8F8; color: #1E2A2D; min-height: 100vh; }
        .sidebar { width: 280px; background: #1E2A2D; color: white; height: 100vh; padding: 30px 20px; box-sizing: border-box; position: fixed; top: 0; left: 0; display: flex; flex-direction: column; }
        .sidebar h3 { font-size: 18px; font-weight: 800; margin-bottom: 24px; color: #16697A; padding-left: 10px; }
        .sidebar a { display: block; color: #cbd5e1; text-decoration: none; padding: 12px 16px; border-radius: 12px; margin-bottom: 6px; font-weight: 500; font-size: 15px; transition: all 0.2s; }
        .sidebar a:hover, .sidebar a.active { color: white; background: rgba(22, 105, 122, 0.2); }
        .sidebar a.active { color: #16697A; font-weight: 600; }
        .content { margin-left: 280px; flex: 1; padding: 40px; box-sizing: border-box; max-width: 1000px; }
        .card { background: white; padding: 32px; border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.03); margin-bottom: 24px; }
        h2 { font-size: 26px; font-weight: 800; margin-bottom: 20px; color: #1a1a1a; }
        .profile-info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .info-group label { display: block; font-size: 13px; font-weight: 600; color: #666; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-group span { font-size: 16px; font-weight: 600; color: #111; }
        .btn { display: inline-block; padding: 12px 24px; background: #16697A; color: white; border-radius: 16px; text-decoration: none; font-weight: 700; font-size: 15px; transition: background 0.2s; }
        .btn:hover { background: #0E3440; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .content { margin-left: 0; padding: 20px; }
            body { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>Личный кабинет</h3>
        <a href="pages/profile.html" class="active">Профиль</a>
        <a href="pages/loyalty.html">Программа лояльности</a>
        <a href="pages/services.html">Сервисная информация</a>
        <a href="pages/settings.html">Настройки</a>
        <a href="index.html">На главную</a>
        <a href="pages/auth.html" style="color: #ff6b6b; margin-top: auto;">Выход</a>
    </div>
    <div class="content">
        <div class="card">
            <h2>Личные данные</h2>
            <div class="profile-info">
                <div class="info-group">
                    <label>ФИО пациента</label>
                    <span>Иванов Алексей Дмитриевич</span>
                </div>
                <div class="info-group">
                    <label>Телефон</label>
                    <span>+7 (999) 123-45-67</span>
                </div>
                <div class="info-group">
                    <label>Email</label>
                    <span>alexey@example.com</span>
                </div>
                <div class="info-group">
                    <label>Дата рождения</label>
                    <span>15.05.1990</span>
                </div>
            </div>
            <a href="pages/settings.html" class="btn">Редактировать профиль</a>
        </div>
        <div class="card">
            <h2>Ближайшие записи</h2>
            <p style="color: #666; margin-bottom: 16px;">У вас пока нет запланированных визитов.</p>
            <a href="pages/our-services.html" class="btn">Записаться на приём</a>
        </div>
    </div>
  <script src="a11y.js" defer></script>
  <script src="chat.js" defer></script>
</body>
</html>
