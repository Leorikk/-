<div id="navigationTestModal" class="test-modal-overlay">
  <div class="test-modal-card">
    <button type="button" class="test-modal-close" data-test-close>&times;</button>
    <h2>Навигационный тест</h2>
    <p class="test-subtitle">Ответьте на 4 вопроса, чтобы мы точно подобрали нужную информацию.</p>
    
    <!-- Шаг 1 -->
    <div id="testStep1" class="test-step">
      <h3>1. Для кого нужна информация?</h3>
      <div class="test-options">
        <button type="button" class="test-option-btn" onclick="selectTestOption(1, 'child')">Ребёнок</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(1, 'adult')">Взрослый</button>
      </div>
    </div>

    <!-- Шаг 2 -->
    <div id="testStep2" class="test-step" style="display: none;">
      <h3>2. Что вы хотите сделать?</h3>
      <div class="test-options">
        <button type="button" class="test-option-btn" onclick="selectTestOption(2, 'appointment')">Записаться</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(2, 'services')">Посмотреть услуги</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(2, 'how_it_works')">Понять, как проходит консультация</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(2, 'materials')">Изучить материалы</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(2, 'preparation')">Подготовиться к приёму</button>
      </div>
    </div>

    <!-- Шаг 3 -->
    <div id="testStep3" class="test-step" style="display: none;">
      <h3>3. Вы уже были на консультации?</h3>
      <div class="test-options">
        <button type="button" class="test-option-btn" onclick="selectTestOption(3, 'yes')">Да</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(3, 'no')">Нет</button>
      </div>
    </div>

    <!-- Шаг 4 -->
    <div id="testStep4" class="test-step" style="display: none;">
      <h3>4. Что показать дальше?</h3>
      <div class="test-options">
        <button type="button" class="test-option-btn" onclick="selectTestOption(4, 'service')">Релевантную услугу</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(4, 'material')">Материал</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(4, 'appointment')">Запись</button>
        <button type="button" class="test-option-btn" onclick="selectTestOption(4, 'doctor_pol')">Доктора Поля</button>
      </div>
    </div>

    <!-- Результат -->
    <div id="testResult" class="test-step" style="display: none;">
      <h3>Результат подбора</h3>
      <p id="testResultText" style="margin: 15px 0 25px; color: #555; line-height: 1.5;"></p>
      <div id="testResultAction" style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <button type="button" class="btn btn-outline" onclick="resetTest()">Пройти заново</button>
      </div>
    </div>
  </div>
</div>
