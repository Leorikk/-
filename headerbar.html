<style>
  .fixed-header-wrapper {
    position: fixed;
    top: 16px;
    left: 0;
    width: 100%;
    z-index: 99999;
    display: flex;
    justify-content: center;
    padding: 0 16px;
    padding-right: 382px; /* место под город и «Записаться» справа от рамки */
    pointer-events: none;
  }

  .custom-navbar {
    pointer-events: auto;
    position: relative;
    background: #ffffff;
    width: 100%;
    max-width: 700px;
    border-radius: 40px;
    padding: 7px 20px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 24px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* Блок имени и специализации */
  .navbar-brand-group {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    flex-shrink: 0;
  }

  .navbar-logo {
    font-size: 18px;
    font-weight: 800;
    color: #1a1a1a;
    text-decoration: none;
    white-space: nowrap;
    line-height: 1.2;
  }

  .navbar-spec {
    font-size: 12.5px;
    font-weight: 600;
    color: #1a1a1a;
    white-space: nowrap;
  }

  /* Меню сайта (увеличенный размер, уменьшенные отступы) */
  .navbar-menu {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    flex: 0 1 auto;
    min-width: 0;
    gap: 6px 26px;
    list-style: none;
    margin: 0 0 0 auto;
    padding: 0;
  }

  .navbar-menu a {
    text-decoration: none;
    font-size: 15px;
    font-weight: 600;
    color: #1a1a1a;
    transition: color 0.2s ease;
    display: block;
    text-align: center;
    line-height: 1.2;
  }

  .navbar-menu a { white-space: nowrap; }
  .navbar-menu li { flex: 0 0 auto; }

  .navbar-menu a:hover,
  .navbar-menu a.active {
    color: #16697A;
  }

  /* Правая группа элементов */
  .navbar-right-group {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-left: auto;
    margin-right: -9px;
    flex-shrink: 0;
  }

  .navbar-cabinet-btn {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    box-sizing: border-box;
    display: flex;
    align-items: center; 
    justify-content: center;
    text-decoration: none;
    color: #16697A;
    background: #E6F1F2;
    overflow: hidden;
    border-radius: 50%;
    transition: background 0.2s, color 0.2s;
  }

  .navbar-cabinet-btn:hover {
    background: #16697A;
    color: #ffffff;
  }

  /* Город и «Записаться» — за белой рамкой, в правом верхнем углу */
  .navbar-outside {
    position: absolute;
    top: 0;
    bottom: 0;
    left: calc(100% + 12px);
    display: flex;
    align-items: center;
    gap: 12px;
    pointer-events: auto;
  }

  .navbar-city {
    position: relative;
    flex: 0 0 auto;
    pointer-events: auto;
    outline: none;
    font-family: inherit;
  }

  .navbar-city-current {
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    height: 44px;
    padding: 0 14px 0 14px;
    border: 1.5px solid #CFE5E9;
    border-radius: 999px;
    background: #ffffff;
    font-size: 15px;
    font-weight: 700;
    color: #1E2A2D;
    white-space: nowrap;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(14, 52, 64, 0.1);
    transition: border-color 0.2s;
  }

  .navbar-city-current:hover, .navbar-city.open .navbar-city-current { border-color: #3EB8CF; }

  .navbar-city-current .beacon-dot {
    position: relative;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #FF4111;
    flex: none;
  }

  .navbar-city-current .beacon-dot::after {
    content: "";
    position: absolute;
    inset: -5px;
    border-radius: 50%;
    border: 2px solid #FF4111;
    opacity: 0;
    animation: cityPulse 2.4s cubic-bezier(.22,.8,.26,1) infinite;
  }

  @keyframes cityPulse { 0% { transform: scale(.5); opacity: .8; } 80%, 100% { transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .navbar-city-current .beacon-dot::after { animation: none; } }

  .navbar-city-current svg { flex-shrink: 0; color: #16697A; transition: transform 0.2s; }
  .navbar-city.open .navbar-city-current svg { transform: rotate(180deg); }

  .navbar-city-list {
    display: none;
    position: absolute;
    top: calc(100% + 10px);
    right: 0;
    z-index: 5;
    width: 320px;
    max-width: calc(100vw - 32px);
    box-sizing: border-box;
    padding: 18px;
    background: #ffffff;
    border: 1px solid #E6F1F2;
    border-radius: 28px 40px 32px 24px;
    box-shadow: 0 2px 4px rgba(14, 52, 64, 0.06), 0 22px 44px -20px rgba(14, 52, 64, 0.24);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  .navbar-city.open .navbar-city-list { display: block; }

  .navbar-city-list h4 {
    margin: 0 0 10px;
    font: 700 17px/1.3 'Manrope', 'Inter', sans-serif;
    color: #1E2A2D;
  }

  .navbar-city-list p {
    margin: 10px 0 0;
    font-size: 14px;
    line-height: 1.45;
    color: #56686D;
  }

  .navbar-city-opt {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1.5px solid transparent;
    border-radius: 16px;
    background: none;
    font: inherit;
    text-align: left;
    cursor: pointer;
    color: #1E2A2D;
  }

  .navbar-city-opt:hover { background: #F4F8F8; }
  .navbar-city-opt[aria-checked="true"] { border-color: #CFE5E9; background: #F4F8F8; }
  .navbar-city-opt b { display: block; font: 600 16px/1.3 'Manrope', 'Inter', sans-serif; }
  .navbar-city-opt .navbar-city-addr { font-size: 15px; color: #56686D; }

  .navbar-city-opt .navbar-city-radio {
    flex: none;
    width: 18px;
    height: 18px;
    margin-top: 2px;
    border: 2px solid #CFE5E9;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }

  .navbar-city-opt[aria-checked="true"] .navbar-city-radio { border-color: #FF4111; }
  .navbar-city-opt[aria-checked="true"] .navbar-city-radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #FF4111; }

  .navbar-outside .a11y-eye {
    position: static;
    flex: 0 0 auto;
    width: 42px;
    height: 42px;
    z-index: auto;
  }

  .navbar-btn {
    display: inline-block;
    box-sizing: border-box;
    min-width: 150px;
    line-height: 22px;
    text-decoration: none;
    font-weight: 700;
    transition: all 0.2s ease;
    text-align: center;
    white-space: nowrap;
    background-color: #FF4111;
    color: #ffffff;
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 14px;
    border-radius: 10px;
  }

  .navbar-btn:hover {
    background-color: #F2380A;
    box-shadow: 0 4px 14px rgba(255, 65, 17, 0.4);
  }

  .navbar-btn:active {
    transform: scale(0.98);
  }

  @media (max-width: 1100px) {
    .fixed-header-wrapper { padding-right: 16px; }
    .navbar-outside { left: auto; right: 0; top: calc(100% + 10px); bottom: auto; }
    .navbar-menu { gap: 6px 8px; }
    .navbar-menu a { font-size: 13px; }
    .custom-navbar { padding: 8px 16px; }
  }

  @media (max-width: 950px) {
    .navbar-menu {
      display: none;
    }
  }

  /* режим для слабовидящих (общие стили — в /a11y.css): шапка не закреплена, меню остаётся и переносится */
  html[data-a11y="on"] .custom-navbar { border: 2px solid var(--a-fg) !important; flex-wrap: wrap; justify-content: space-between; border-radius: 28px; }
  html[data-a11y="on"] .fixed-header-wrapper { position: relative; top: 0; padding-top: 16px; }
  html[data-a11y="on"] .navbar-menu { display: flex !important; order: 3; flex: 1 1 100%; }
  html[data-a11y="on"] .hero-section { min-height: 0; }
  html[data-a11y="on"] .hero-content-wrapper { flex-direction: column; align-items: stretch; }
  html[data-a11y="on"] .hero-doctor { position: static; right: auto; bottom: auto; height: auto; max-width: 100%; text-align: center; }
</style>

  <nav class="custom-navbar">

      <span class="navbar-spec">Аллерголог-иммунолог</span>

    <ul class="navbar-menu">

      <li><a href="pages/our-services.html" data-page="services">Услуги</a></li>

      <li><a href="pages/contacts.html" data-page="contacts">Контакты</a></li>
    </ul>

    <div class="navbar-right-group">
      <a href="pages/profile.html" class="navbar-cabinet-btn" title="Личный кабинет" aria-label="Личный кабинет"><svg width="80%" height="80%" viewBox="2.5 2.5 19 19" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg></a>
    </div>

    <div class="navbar-outside">
      <div class="navbar-city">
        <button type="button" class="navbar-city-current" aria-haspopup="dialog" aria-expanded="false"><span class="beacon-dot" aria-hidden="true"></span><span class="navbar-city-name">Владивосток</span><svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l4 4 4-4"/></svg></button>
        <div class="navbar-city-list" role="dialog" aria-label="Выбор филиала">
          <h4>Выберите филиал</h4>

            <button type="button" class="navbar-city-opt" role="radio" aria-checked="true" data-city="Владивосток"><span class="navbar-city-radio" aria-hidden="true"></span><span><b>Владивосток</b><span class="navbar-city-addr">ул. Лазо, д. 8</span></span></button>
            <button type="button" class="navbar-city-opt" role="radio" aria-checked="false" data-city="Уссурийск"><span class="navbar-city-radio" aria-hidden="true"></span><span><b>Уссурийск</b><span class="navbar-city-addr">ул. Тимирязева, д. 8</span></span></button>
          </div>
          <p>Филиал по умолчанию подставится в форму записи.</p>
        </div>
      </div>
      <button type="button" class="a11y-eye" id="a11yEye" data-a11y-toggle title="Версия для слабовидящих" aria-label="Версия для слабовидящих" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      <a href="#appointmentPopup" class="navbar-btn" data-appointment-open>Записаться</a>
    </div>
  </nav>
</div>
</body>
